<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Accent Candidates</title>
<style>
  body { margin: 0; padding: 24px; background: #0f0f0f; color: #ddd; font-family: "Yu Gothic UI", "Segoe UI", sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.note { margin: 0 0 20px; color: #999; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(560px, 1fr)); gap: 20px; }
  .card { border: 1px solid #333; border-radius: 10px; overflow: hidden; background: #181818; }
  .card h2 { margin: 0; padding: 10px 14px; font-size: 15px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #333; }
  .sw { width: 18px; height: 18px; border-radius: 4px; display: inline-block; }
  .card h2 code { color: #999; font-size: 12px; font-weight: normal; }
  .theme { padding: 14px 16px; display: grid; gap: 10px; font-size: 13.5px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .spin { font-family: "Segoe UI Symbol", "Cascadia Mono", monospace; font-size: 18px; width: 18px; text-align: center; }
  .bubble { padding: 8px 12px; border-radius: 8px; }
  .hit { padding: 6px 10px; border-radius: 8px; border: 1.5px solid transparent; }
  .flat { padding: 3px 8px; border-radius: 5px; }
  .opt { padding: 6px 10px; border-radius: 6px; border: 1px solid; }
  .badge { padding: 1px 6px; border-radius: 5px; font-size: 12px; }
  .send { width: 28px; height: 28px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 15px; }
  .input { flex: 1; min-width: 160px; padding: 6px 10px; border-radius: 6px; border: 1px solid; }
  .done { color: rgb(96,165,96); }
</style>
</head>
<body>
<h1>チャットビュー アクセント色 候補</h1>
<p class="note">DocumentViewPanel.cs の ChatTheme.Accent / AccentColor を差し替えた場合の見え方。上段がダーク、下段がライトテーマ（背景色は ChatTheme の実値）。「テーマ別」はダーク/ライトで別の値を使う案。</p>
<div class="grid" id="grid"></div>
<script>
const candidates = [
  { name: "現行 オレンジ", dark: "#D97757" },
  { name: "グリーン（アイコン色）", dark: "#22C55E" },
  { name: "グリーン テーマ別", dark: "#4ADE80", light: "#16A34A" },
  { name: "ブルー", dark: "#3B82F6" },
  { name: "スカイ テーマ別", dark: "#38BDF8", light: "#0284C7" },
  { name: "ティール", dark: "#14B8A6" },
  { name: "バイオレット", dark: "#8B5CF6" },
  { name: "インディゴ", dark: "#6366F1" },
  { name: "ローズ", dark: "#F43F5E" },
];
const T = {
  dark:  { bg: "rgb(21,21,21)",    bubble: "rgb(33,33,33)",    surface: "rgb(32,32,31)",    outline: "rgb(55,55,54)",    fg: "#e6e6e6", dim: "#8a8a8a", selA: 40/255, badgeA: 70/255 },
  light: { bg: "rgb(252,252,251)", bubble: "rgb(240,240,239)", surface: "rgb(255,255,255)", outline: "rgb(223,223,222)", fg: "#1f1f1f", dim: "#777",    selA: 28/255, badgeA: 0.22 },
};
const frames = ["⠋","⠙","⠹","⠸","⠼","⠴","⠦","⠧","⠇","⠏"];
function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}
function theme(mode, c) {
  const t = T[mode], a = c;
  return `<div class="theme" style="background:${t.bg};color:${t.fg}">
    <div class="row"><span class="spin" style="color:${a}">⠋</span><span style="color:${t.dim}">作業中…</span>
      <span style="margin-left:auto;color:${a};cursor:pointer">↗ エディタで開く</span></div>
    <div class="row">
      <span class="hit" style="background:${rgba(a,.14)};border-color:${a}">検索ヒット（現在）</span>
      <span class="hit" style="background:${rgba(a,.06)}">検索ヒット</span>
      <span class="flat" style="color:${a}">← メインに戻る</span>
    </div>
    <div class="row">
      <span style="color:${a}">◐</span><span style="color:${a}">テストを実行しています</span>
      <span class="done">✓</span><span style="color:${t.dim}">完了タスク</span>
      <span style="color:${a}">●</span><span>Explore</span><span style="color:${a};font-size:12px">実行中</span>
    </div>
    <div class="row">
      <span class="badge" style="background:${rgba(a,t.badgeA)}">1/3</span>
      <span class="opt" style="background:${rgba(a,t.selA)};border-color:${a}">選択中の回答</span>
      <span class="opt" style="border-color:${t.outline};background:${t.surface}">他の選択肢</span>
    </div>
    <div class="row">
      <span class="input" style="background:${t.surface};border-color:${t.outline};color:${t.dim}">メッセージを入力…</span>
      <span class="send" style="background:${a}">➤</span>
    </div>
  </div>`;
}
const grid = document.getElementById("grid");
for (const c of candidates) {
  const light = c.light || c.dark;
  const label = c.light ? `${c.dark} / ${c.light}` : c.dark;
  grid.insertAdjacentHTML("beforeend", `<div class="card">
    <h2><span class="sw" style="background:${c.dark}"></span>${c.light ? `<span class="sw" style="background:${c.light}"></span>` : ""}${c.name} <code>${label}</code></h2>
    ${theme("dark", c.dark)}${theme("light", light)}</div>`);
}
let f = 0;
setInterval(() => { f = (f + 1) % frames.length; document.querySelectorAll(".spin").forEach(s => s.textContent = frames[f]); }, 80);
</script>
</body>
</html>
